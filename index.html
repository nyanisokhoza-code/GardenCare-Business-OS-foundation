function loadDB(){

    const current=JSON.parse(localStorage.getItem(KEY)||'null');
    if(current) return normalizeDB(current);
    const old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');

      migrated.version=VERSION;
      migrated.invoices=(old.invoices||[]).map(i=>normalizeInvoice({
        ...i,number:i.id||nextInvoiceNumberFrom(migrated.invoices||[]),invoiceDate:(i.createdAt||today()).slice(0,10),dueDate:addDays((i.createdAt||today()).slice(0,10),7),

  }catch(err){console.warn('GardenCare data load failed',err)}

}
function normalizeDB(raw){
 const out=deepClone(DEFAULTS); Object.assign(out,raw||{}); out.settings=Object.assign({},DEFAULTS.settings,raw?.settings||{});
 for(const k of ['customers','properties','quotes','jobs','invoices','payments','employees','applicants','expenses','assessments','activity','signatureProducts']) if(!Array.isArray(out[k])) out[k]=[];
 if(!out.restorationChecks||typeof out.restorationChecks!=='object')out.restorationChecks={};
 // v0.8.6 changes the vehicle field to the user's intended unit: litres per 100 km.
 // Existing saved value 12 is migrated as 12 L/100 km rather than 12 km/L.
 if(raw?.settings?.fuelLitresPer100Km===undefined&&raw?.settings?.fuelKmPerLitre!==undefined)out.settings.fuelLitresPer100Km=num(raw.settings.fuelKmPerLitre)||12;

function nextSeq(records,field,prefix){let m=0;for(const r of records){const v=String(r[field]||r.id||'');const hit=v.match(/(\d+)$/);if(hit)m=Math.max(m,Number(hit[1]))}return prefix+String(m+1).padStart(3,'0')}

function calcInvoice(inv){
 const subtotal=(inv.items||[]).reduce((sum,it)=>sum+(it.mode==='amount'?num(it.qty)*num(it.unitPrice):0),0);
 const discount=Math.max(0,num(inv.discount)); const taxable=Math.max(0,subtotal-discount); const vat=taxable*Math.max(0,num(inv.vatPct))/100; const total=taxable+vat; const paid=Math.max(0,num(inv.paid)); const balance=Math.max(0,total-paid);
 return {subtotal,discount,vat,total,paid,balance};
}
function invoiceStatus(inv){const c=calcInvoice(inv);if(c.total>0&&c.balance<=.005)return'Paid';if(c.paid>0)return'Partially paid';if(inv.dueDate&&inv.dueDate<today())return'Overdue';return inv.status==='Draft'?'Draft':'Unpaid'}
function calcJob(area,workers,hours,distance,overrides={}){
 const s=db.settings;
 const val=(key,fallback)=>overrides[key]===undefined?num(fallback):num(overrides[key]);
 const a=Math.max(0,num(area));
 const coverage=Math.max(.1,val('coverageM2',s.coverageM2));
 const wastePct=Math.max(0,val('wastePct',s.wastePct));
 const reserveBags=Math.max(0,Math.round(val('reserveBags',s.reserveBags)));
 const bagCost=Math.max(0,val('bagCost',s.bagCost));
 const rawBags=a/coverage;
 const required=Math.ceil(rawBags*(1+wastePct/100));
 const bags=required+reserveBags;
 const material=bags*bagCost;
 const labourRate=Math.max(0,val('labourRate',s.labourRate));
 const workerCount=Math.max(1,num(workers)||1);
 const jobHours=Math.max(0,num(hours));
 const labour=workerCount*jobHours*labourRate;
 const oneWayKm=Math.max(0,num(distance));
 const trips=Math.max(1,Math.round(val('trips',1)||1));
 const returnTrip=overrides.returnTrip===undefined?Boolean(s.returnTrip):Boolean(overrides.returnTrip);
 const totalKm=oneWayKm*(returnTrip?2:1)*trips;
 const fuelLitresPer100Km=Math.max(0,val('fuelLitresPer100Km',s.fuelLitresPer100Km));
 const fuelPrice=Math.max(0,val('fuelPrice',s.dieselPrice));
 const fuelLitres=totalKm*fuelLitresPer100Km/100;
 const fuelCost=fuelLitres*fuelPrice;
 const vehicleCostPerKm=Math.max(0,val('vehicleCostPerKm',s.vehicleCostPerKm||0));
 const vehicleCost=totalKm*vehicleCostPerKm;
 const travel=fuelCost+vehicleCost;
 const equipment=Math.max(0,val('equipment',s.equipment));
 const consumables=Math.max(0,val('consumables',s.consumables||0));
 const disposal=Math.max(0,val('disposal',s.disposal||0));
 const subtotal=material+labour+travel+equipment+consumables+disposal;
 const overheadPct=Math.max(0,val('overheadPct',s.overheadPct));
 const overhead=subtotal*overheadPct/100;
 const cost=subtotal+overhead;
 const markupPct=Math.max(0,val('markupPct',s.markupPct));
 const markup=cost*markupPct/100;
 const sell=cost+markup;
 return{bags,rawBags,required,material,labour,labourRate,travel,totalKm,fuelLitres,fuelCost,vehicleCost,vehicleCostPerKm,equipment,consumables,disposal,subtotal,overhead,overheadPct,cost,markup,markupPct,sell,coverage,wastePct,reserveBags,bagCost,trips,returnTrip,fuelLitresPer100Km,fuelPrice,workerCount,jobHours};
}

function recommendWorkers(area){
 const a=Math.max(0,num(area));
 // Current GardenCare operating model: maximum field crew is 3.
 // Preserve configurable area rules where possible, but never let stale saved rules
 // silently return 4/5 workers or fail back to 1 for a larger lawn.
 const fallback=[{maxM2:50,workers:1},{maxM2:120,workers:2},{maxM2:999999,workers:3}];
 const rules=(Array.isArray(db.settings.labourRules)&&db.settings.labourRules.length?db.settings.labourRules:fallback)
   .map(r=>({maxM2:Math.max(0,num(r.maxM2)),workers:Math.min(3,Math.max(1,Math.round(num(r.workers)||1))) }))
   .filter(r=>r.maxM2>0)
   .sort((x,y)=>x.maxM2-y.maxM2);
 for(const r of rules) if(a<=r.maxM2) return r.workers;
 return 3;
}
function workerRecommendationText(area){
 const a=Math.max(0,num(area)),w=recommendWorkers(a);
 return `Current recommendation: ${w} worker(s) for ${a.toFixed(a%1?1:0)} m²${w===3?' · current crew cap reached':''}`;
}

  teamSize:Math.min(3,Math.max(1,Math.round(num(raw.teamSize)||1))),hoursPerWorker:Math.max(0,num(raw.hoursPerWorker)),workerCostPerHour:Math.max(0,num(raw.workerCostPerHour)),directorHours:Math.max(0,num(raw.directorHours)),directorHourlyCost:Math.max(0,num(raw.directorHourlyCost)),
  distanceKm:Math.max(0,num(raw.distanceKm)),trips:Math.max(1,Math.round(num(raw.trips)||1)),returnTrip:form.elements.returnTrip?.checked??true,fuelLitresPer100Km:Math.max(0,num(raw.fuelLitresPer100Km)),fuelPrice:Math.max(0,num(raw.fuelPrice)),vehicleCostPerKm:Math.max(0,num(raw.vehicleCostPerKm)),
  equipment:Math.max(0,num(raw.equipment)),consumables:Math.max(0,num(raw.consumables)),disposal:Math.max(0,num(raw.disposal)),otherDirect:Math.max(0,num(raw.otherDirect)),monthlyFixedOverhead:Math.max(0,num(raw.monthlyFixedOverhead)),directorMonthlyCost:Math.max(0,num(raw.directorMonthlyCost)),expectedJobsPerMonth:Math.max(1,Math.round(num(raw.expectedJobsPerMonth)||1)),targetMarginPct:Math.min(95,Math.max(0,num(raw.targetMarginPct)))
 };
}
function calcBreakEven(v){
 const rawBags=v.area/v.coverageM2,required=Math.ceil(rawBags*(1+v.wastePct/100)),bags=required+v.reserveBags,materials=bags*v.bagCost;
 const crew=v.teamSize*v.hoursPerWorker*v.workerCostPerHour,directorTime=v.directorHours*v.directorHourlyCost,totalKm=v.distanceKm*(v.returnTrip?2:1)*v.trips,fuelLitres=totalKm*v.fuelLitresPer100Km/100,fuel=fuelLitres*v.fuelPrice,wear=totalKm*v.vehicleCostPerKm;
 const directCost=materials+crew+directorTime+fuel+wear+v.equipment+v.consumables+v.disposal+v.otherDirect;
 const monthlyBusinessCost=v.monthlyFixedOverhead+v.directorMonthlyCost,overheadPerJob=monthlyBusinessCost/Math.max(1,v.expectedJobsPerMonth),breakEven=directCost+overheadPerJob;
 const targetPrice=v.targetMarginPct>=95?breakEven:breakEven/(1-v.targetMarginPct/100),targetProfit=Math.max(0,targetPrice-breakEven);
 return{rawBags,required,bags,materials,crew,directorTime,totalKm,fuelLitres,fuel,wear,directCost,monthlyBusinessCost,overheadPerJob,breakEven,targetPrice,targetProfit};
}
function updateCostingDOM(){

 const formula=$('#beFormula');if(formula)formula.textContent=`Break-even = direct job cost ${money(c.directCost)} + allocated monthly business cost ${money(c.overheadPerJob)} = ${money(c.breakEven)}. Target price at ${v.targetMarginPct.toFixed(1)}% gross margin = ${money(c.breakEven)} ÷ (1 - ${(v.targetMarginPct/100).toFixed(3)}) = ${money(c.targetPrice)}.`;
}

function quoteSeed(q){
 const j=db.jobs.find(x=>x.quoteId===q.id)||{};const e=q.estimate||j.estimate||{};const s=db.settings;
 const pick=(name,fallback=0)=>{for(const src of [j,e,q]){if(src&&src[name]!==undefined&&src[name]!==null&&src[name]!=='')return src[name]}return fallback};
 return{area:num(pick('area',q.area)),workers:Math.max(1,num(pick('workers',e.workerCount||1))||1),hours:num(pick('hours',e.jobHours||s.defaultJobHours)),distanceKm:num(pick('distanceKm',0)),trips:Math.max(1,num(pick('trips',e.trips||1))||1),returnTrip:pick('returnTrip',e.returnTrip!==false)!==false,fuelType:String(pick('fuelType','Diesel')||'Diesel'),bagCost:num(pick('bagCost',s.bagCost)),coverageM2:num(pick('coverageM2',e.coverage||s.coverageM2)),wastePct:num(pick('wastePct',e.wastePct||s.wastePct)),reserveBags:num(pick('reserveBags',e.reserveBags||s.reserveBags)),labourRate:num(pick('labourRate',e.labourRate||s.labourRate)),fuelPrice:num(pick('fuelPrice',e.fuelPrice||s.dieselPrice)),fuelLitresPer100Km:num(pick('fuelLitresPer100Km',pick('fuelKmPerLitre',e.fuelLitresPer100Km||e.fuelKmPerLitre||s.fuelLitresPer100Km))),vehicleCostPerKm:num(pick('vehicleCostPerKm',e.vehicleCostPerKm||s.vehicleCostPerKm||0)),equipment:num(pick('equipment',e.equipment||s.equipment)),consumables:num(pick('consumables',e.consumables||s.consumables||0)),disposal:num(pick('disposal',e.disposal||s.disposal||0)),overheadPct:num(pick('overheadPct',e.overheadPct||s.overheadPct)),markupPct:num(pick('markupPct',e.markupPct||s.markupPct))};
}

function updateQuoteEstimateDOM(syncSelling=true,sourceName=''){
 const f=$('#quoteEditor');if(!f)return;
 // Area changes should refresh the workforce recommendation as well as bags/costs.
 // The worker count follows the recommendation until the user deliberately edits it.
 const workerInput=f.elements.workers;
 if(workerInput&&sourceName==='area'&&workerInput.dataset.manual!=='1')workerInput.value=String(recommendWorkers(f.elements.area?.value));
 let v=quoteFormValues(f),c=smartEstimateFromValues(v);const set=(id,val)=>{const el=$('#'+id);if(el)el.textContent=val};
 set('quoteBags',String(c.bags));set('quoteMaterialCost',money(c.material));set('quoteLabourCost',money(c.labour));set('quoteWorkerHint',`${workerRecommendationText(v.area)}${workerInput?.dataset.manual==='1'?' · manual override active':' · auto-following area'}`);set('quoteTotalKm',`${c.totalKm.toFixed(1)} km`);set('quoteFuelLitres',`${c.fuelLitres.toFixed(2)} L`);set('quoteTravelCost',money(c.travel));set('quoteTrueCost',money(c.cost));set('quoteRecommended',money(c.sell));
 const bag=$('#quoteBagFormula');if(bag)bag.textContent=`${v.area||0} m² ÷ ${c.coverage.toFixed(1)} m²/bag + ${c.wastePct}% wastage + ${c.reserveBags} reserve = ${c.bags} bag(s) to site.`;
 const labour=$('#quoteLabourFormula');if(labour)labour.textContent=`${c.workerCount} worker(s) × ${c.jobHours.toFixed(1)} hour(s) × ${money(c.labourRate)}/hour = ${money(c.labour)}.`;
 const travel=$('#quoteTravelFormula');if(travel)travel.textContent=`${v.distanceKm||0} km one-way × ${c.returnTrip?2:1} × ${c.trips} trip(s) = ${c.totalKm.toFixed(1)} km. Fuel required ${c.fuelLitres.toFixed(2)} L; travel cost ${money(c.travel)}.`;
 const sell=f.elements.total;if(sell&&syncSelling&&sell.dataset.manual!=='1')sell.value=c.sell.toFixed(2);
}

function renderInvoiceEditor(){
 const inv=invoiceEditor;if(!inv)return;const c=calcInvoice(inv);const existingId=inv.id;const customerOptions=`<option value="">— Type customer details manually —</option>${db.customers.map(x=>`<option value="${x.id}" ${x.id===inv.customerId?'selected':''}>${esc(x.name)} · ${esc(x.phone||'')}</option>`).join('')}`;

function invoiceRowHTML(it){return `<div class="invoiceRow" data-line-id="${it.id}"><div><span class="rowLabel">Description</span><input data-line-field="description" value="${esc(it.description)}"></div><div><span class="rowLabel">Qty</span><input data-line-field="qty" type="number" step="0.01" min="0" value="${num(it.qty)}"></div><div><span class="rowLabel">Unit</span><input data-line-field="unit" value="${esc(it.unit)}" placeholder="bags"></div><div><span class="rowLabel">Unit price</span><input data-line-field="unitPrice" type="number" step="0.01" min="0" value="${num(it.unitPrice)}"></div><div class="amountCell"><span class="rowLabel">Price display</span><select data-line-field="mode"><option value="amount" ${it.mode==='amount'?'selected':''}>${money(num(it.qty)*num(it.unitPrice))}</option><option value="tbd" ${it.mode==='tbd'?'selected':''}>TBD (to be discussed)</option><option value="dash" ${it.mode==='dash'?'selected':''}>—</option></select></div><div class="removeCell"><span class="rowLabel">&nbsp;</span><button type="button" class="rowRemove" data-action="remove-invoice-row" data-id="${it.id}" title="Remove row">×</button></div></div>`}
function invoiceTotalsHTML(inv){const c=calcInvoice(inv);return `<div class="totalLine"><span>Subtotal</span><b>${money(c.subtotal)}</b></div>${c.discount?`<div class="totalLine"><span>Discount</span><b>− ${money(c.discount)}</b></div>`:''}${c.vat?`<div class="totalLine"><span>VAT (${num(inv.vatPct)}%)</span><b>${money(c.vat)}</b></div>`:''}<div class="totalLine grand"><span>Amount due</span><b>${money(c.total)}</b></div>`}
function syncInvoiceEditorFromDOM(){if(!invoiceEditor)return;const f=$('#invoiceEditorForm');if(!f)return;const fd=new FormData(f);for(const k of ['customerId','customerName','phone','email','number','address','invoiceDate','dueDate','service','status','notes'])invoiceEditor[k]=fd.get(k)||'';invoiceEditor.discount=num(fd.get('discount'));invoiceEditor.vatPct=num(fd.get('vatPct'));invoiceEditor.items=$$('.invoiceRow',f).map(row=>({id:row.dataset.lineId,description:$('[data-line-field="description"]',row)?.value||'',qty:num($('[data-line-field="qty"]',row)?.value),unit:$('[data-line-field="unit"]',row)?.value||'',unitPrice:num($('[data-line-field="unitPrice"]',row)?.value),mode:$('[data-line-field="mode"]',row)?.value||'amount'}));invoiceEditor.updatedAt=new Date().toISOString();}
function updateInvoiceTotalsDOM(){syncInvoiceEditorFromDOM();const box=$('#invoiceTotals');if(box)box.innerHTML=invoiceTotalsHTML(invoiceEditor);$$('.invoiceRow').forEach(row=>{const id=row.dataset.lineId,it=invoiceEditor.items.find(x=>x.id===id);const sel=$('[data-line-field="mode"]',row);if(sel&&it){const amountOpt=$('option[value="amount"]',sel);if(amountOpt)amountOpt.textContent=money(num(it.qty)*num(it.unitPrice))}})}
function saveInvoiceEditor(){syncInvoiceEditorFromDOM();if(!invoiceEditor.customerName.trim())return toast('Customer name is required.',true);if(!invoiceEditor.number.trim())return toast('Invoice number is required.',true);const idx=db.invoices.findIndex(i=>i.id===invoiceEditor.id);const clean=deepClone(invoiceEditor);delete clean.__isNew;clean.status=invoiceStatus(clean)==='Overdue'?'Unpaid':invoiceStatus(clean);if(idx>=0)db.invoices[idx]=clean;else db.invoices.unshift(clean);activity(idx>=0?'INVOICE_UPDATED':'INVOICE_CREATED',`${clean.number} · ${clean.customerName}`,clean.id);saveDB();invoiceEditor=deepClone(clean);invoiceEditor.__isNew=false;toast('Invoice saved');renderInvoiceEditor();renderView()}

b>${db.settings.bankBranch?`<br>Branch/code: ${esc(db.settings.bankBranch)}`:''}<br>Reference: <b>${esc(inv.number)}</b><br><span class="muted small">${esc(db.settings.paymentNote||'')}</span></div></div></div>`}
function formatQty(q,u){const n=num(q);const x=Number.isInteger(n)?String(n):String(n);return u?`${x} ${u}`:x}

function clientMessage(inv){const c=calcInvoice(inv);const bagLines=inv.items.filter(x=>String(x.unit).toLowerCase().includes('bag')&&num(x.qty)>0);const bags=bagLines.reduce((s,x)=>s+num(x.qty),0);const service=inv.service||'garden/lawn restoration';let msg=`Good afternoon${inv.customerName?` ${inv.customerName}`:''},\n\nWe would like to confirm that the ${service.toLowerCase()} work has been completed.`;if(bags)msg+=` A total of ${Number.isInteger(bags)?bags:bags.toFixed(1)} bags were used for the restoration.`;msg+=`\n\nPlease find invoice ${inv.number} attached. The amount currently due is ${money(c.balance)}.\n\nPayment details:\nBank: ${db.settings.bankName}\nAccount: ${db.settings.bankAccount}\nReference: ${inv.number}\n\nThank you for choosing ${db.settings.businessName}.`;return msg}

function ascii(s){return String(s??'').normalize('NFKD').replace(/[^\x20-\x7E]/g,'').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function pdfText(x,y,text,size=10,bold=false){return `BT /F${bold?'2':'1'} ${size} Tf ${x} ${y} Td (${ascii(text)}) Tj ET\n`}
function wrapText(text,max=78){const words=ascii(text).split(/\s+/);const lines=[];let line='';for(const w of words){if((line+' '+w).trim().length>max){if(line)lines.push(line);line=w}else line=(line+' '+w).trim()}if(line)lines.push(line);return lines}
function buildInvoicePDF(inv){

 if(f.id==='jobEditor'){const j=db.jobs.find(x=>x.id===fd.get('id'));if(j)Object.assign(j,{status:fd.get('status'),area:num(fd.get('area')),notes:fd.get('notes'),updatedAt:new Date().toISOString()});saveDB();closeModal();renderView();return toast('Job saved')}
 if(f.id==='smartJobForm'){
   const raw=smartFormValues(f);smartDraft=Object.assign(smartDraft,raw);const c=ensureCustomer({customerId:raw.customerId,customerName:raw.customerName,phone:raw.phone,email:raw.email,address:raw.address});const estimate=smartEstimateFromValues(raw);const q={id:nextQuoteNumber(),customerId:c.id,customerName:c.name,service:raw.service,area:raw.area,total:estimate.sell,status:'Draft',workers:raw.workers,hours:raw.hours,distanceKm:raw.distanceKm,trips:raw.trips,returnTrip:raw.returnTrip,fuelType:raw.fuelType,bagCost:raw.bagCost,coverageM2:raw.coverageM2,wastePct:raw.wastePct,reserveBags:raw.reserveBags,labourRate:raw.labourRate,fuelPrice:raw.fuelPrice,fuelLitresPer100Km:raw.fuelLitresPer100Km,vehicleCostPerKm:raw.vehicleCostPerKm,equipment:raw.equipment,consumables:raw.consumables,disposal:raw.disposal,overheadPct:raw.overheadPct,markupPct:raw.markupPct,internalCost:estimate.cost,estimate:deepClone(estimate),pricingBasis:'Recommended price',priceHistory:[],createdAt:new Date().toISOString()};db.quotes.unshift(q);const j={id:nextJobNumber(),customerId:c.id,customerName:c.name,address:raw.address,service:raw.service,area:raw.area,bags:estimate.bags,workers:raw.workers,hours:raw.hours,distanceKm:raw.distanceKm,totalKm:estimate.totalKm,trips:raw.trips,returnTrip:raw.returnTrip,fuelType:raw.fuelType,fuelPrice:raw.fuelPrice,fuelLitresPer100Km:raw.fuelLitresPer100Km,travelCost:estimate.travel,materialCost:estimate.material,labourCost:estimate.labour,equipmentCost:estimate.equipment,consumables:estimate.consumables,disposal:estimate.disposal,total:estimate.sell,internalCost:estimate.cost,estimate:deepClone(estimate),status:'Draft',quoteId:q.id,createdAt:new Date().toISOString()};db.jobs.unshift(j);activity('JOB_CREATED',`${j.id} · ${c.name}`,j.id);saveDB();smartDraft={customerId:'',newCustomerName:'',phone:'',email:'',address:'',service:'Lawn restoration',area:0,bags:0,workers:1,hours:db.settings.defaultJobHours,distanceKm:0,trips:1,returnTrip:true,fuelType:'Diesel',status:'Draft'};toast('Quote and job created');navigate('jobs');return
 }
 if(f.id==='costingForm'){const v=costingFormValues(f);Object.assign(db.settings,{bagCost:v.bagCost,coverageM2:v.coverageM2,wastePct:v.wastePct,reserveBags:v.reserveBags,workerCostPerHour:v.workerCostPerHour,directorHourlyCost:v.directorHourlyCost,dieselPrice:v.fuelPrice,fuelLitresPer100Km:v.fuelLitresPer100Km,vehicleCostPerKm:v.vehicleCostPerKm,equipment:v.equipment,consumables:v.consumables,disposal:v.disposal,monthlyFixedOverhead:v.monthlyFixedOverhead,directorMonthlyCost:v.directorMonthlyCost,expectedJobsPerMonth:v.expectedJobsPerMonth,targetMarginPct:v.targetMarginPct});activity('COSTING_SETTINGS_UPDATED','Break-even assumptions updated');saveDB();updateCostingDOM();toast('Costing assumptions saved');return}
 if(f.id==='settingsForm'){settingsSave(fd);return}
 if(f.id==='paymentForm'){const inv=invoiceById(fd.get('invoiceId'));if(!inv)return;const before=calcInvoice(inv);if(before.balance<=.005)return toast('This invoice is already paid.',true);const requested=Math.max(0,num(fd.get('amount')));if(requested<=0)return toast('Enter a payment amount.',true);const amount=Math.min(requested,before.balance);const p={id:uid('PAY'),invoiceId:inv.id,invoiceNumber:inv.number,customerName:inv.customerName,amount,date:fd.get('date')||today(),method:fd.get('method')||'',reference:fd.get('reference')||'',createdAt:new Date().toISOString()};db.payments.unshift(p);inv.paid=num(inv.paid)+amount;inv.status=calcInvoice(inv).balance<=.005?'Paid':'Partially paid';inv.updatedAt=new Date().toISOString();activity('PAYMENT_RECORDED',`${inv.number} · ${money(amount)}`,inv.id);saveDB();closeModal();renderView();toast(requested>amount?`Payment capped at remaining balance ${money(amount)}`:'Payment recorded');return}
 if(f.id==='employeeForm'){db.employees.unshift({id:uid('EMP'),name:fd.get('name'),role:fd.get('role'),phone:fd.get('phone'),status:'Active'});saveDB();closeModal();renderView();return toast('Employee saved')}
 if(f.id==='applicantForm'){db.applicants.unshift({id:uid('APP'),name:fd.get('name'),phone:fd.get('phone'),score:num(fd.get('score')),status:'Applicant'});saveDB();closeModal();renderView();return toast('Applicant saved')}
 if(f.id==='expenseForm'){db.expenses.unshift({id:uid('EXP'),date:fd.get('date'),category:fd.get('category'),description:fd.get('description'),amount:num(fd.get('amount'))});saveDB();closeModal();renderView();return toast('Expense saved')}
 if(f.id==='calloutForm'){const name=fd.get('name')||'there',fee=money(fd.get('fee'));const msg=`Hi ${name}, thank you for contacting ${db.settings.businessName}. We can arrange a site visit to assess the garden and determine the work required.\n\nCall-out & assessment: ${fee}\n\nThis includes the site assessment and preparation of the appropriate quotation.\n\nPlease let us know which day/time would be convenient for you.`;$('#calloutResult').innerHTML=`<div class="notice" style="margin-top:14px"><textarea id="calloutMessage" style="width:100%;min-height:170px;border:0;background:transparent">${esc(msg)}</textarea><button type="button" class="btn" data-action="copy-callout">Copy WhatsApp message</button></div>`;return}
}

function handleInput(e){if(activeModal==='invoice'&&e.target.closest('#invoiceEditorForm')){if(e.target.matches('input,select,textarea')){clearTimeout(handleInput._t);handleInput._t=setTimeout(updateInvoiceTotalsDOM,80)}}if(e.target.closest('#smartJobForm')&&e.target.matches('input,select,textarea')){if(e.target.name==='workers')e.target.dataset.manual='1';const source=e.target.name||'';clearTimeout(handleInput._smartT);handleInput._smartT=setTimeout(()=>updateSmartEstimateDOM(source),40)}if(e.target.closest('#quoteEditor')&&e.target.matches('input,select,textarea')){if(e.target.name==='total'){e.target.dataset.manual='1';const ap=$('#quoteAgreedPreview');if(ap)ap.textContent=money(e.target.value)}if(e.target.name==='workers')e.target.dataset.manual='1';const source=e.target.name||'';clearTimeout(handleInput._quoteT);handleInput._quoteT=setTimeout(()=>updateQuoteEstimateDOM(source!=='total',source),40)}if(e.target.closest('#costingForm')&&e.target.matches('input,select,textarea')){clearTimeout(handleInput._costT);handleInput._costT=setTimeout(updateCostingDOM,35)}if(e.target.id==='globalSearch')globalSearch(e.target.value)}
function handleChange(e){if(e.target.matches('[data-restoration-check]')){db.restorationChecks[e.target.dataset.restorationCheck]=e.target.checked;saveDB();return}if(e.target.closest('#costingForm'))updateCostingDOM();if(e.target.closest('#smartJobForm'))updateSmartEstimateDOM(e.target.name||'');if(e.target.closest('#quoteEditor'))updateQuoteEstimateDOM(e.target.name!=='total',e.target.name||'');if(e.target.id==='invoiceCustomer'){const c=customerById(e.target.value);if(c){const f=$('#invoiceEditorForm');f.elements.customerName.value=c.name||'';f.elements.phone.value=c.phone||'';f.elements.email.value=c.email||'';f.elements.address.value=c.address||'';updateInvoiceTotalsDOM()}}if(e.target.id==='smartCustomer'){const c=customerById(e.target.value);if(c){const f=$('#smartJobForm');if(f){f.elements.customerName.value=c.name||'';f.elements.phone.value=c.phone||'';f.elements.email.value=c.email||'';f.elements.address.value=c.address||''}}}}
function handleExtraAction(e){const a=e.target.closest('[data-action]');if(!a)return;if(a.dataset.action==='copy-marketing-link'){copyText(PUBLIC_FLYER_URL).then(()=>toast('Flyer link copied'));return}if(a.dataset.action==='copy-marketing-message'){copyText(MARKETING_MESSAGE).then(()=>toast('WhatsApp promo message copied'));return}if(a.dataset.action==='copy-callout'){const ta=$('#calloutMessage');if(ta)copyText(ta.value).then(()=>toast('Call-out message copied'))}if(a.dataset.action==='quote-use-recommended'){const f=$('#quoteEditor');if(f){const v=quoteFormValues(f),c=smartEstimateFromValues(v);f.elements.total.value=c.sell.toFixed(2);f.elements.total.dataset.manual='0';const ap=$('#quoteAgreedPreview');if(ap)ap.textContent=money(c.sell);updateQuoteEstimateDOM(true);toast('Agreed price reset to recommendation')}}if(a.dataset.action==='quote-use-recommended-workers'){const f=$('#quoteEditor');if(f){const w=f.elements.workers;w.value=String(recommendWorkers(f.elements.area.value));w.dataset.manual='0';updateQuoteEstimateDOM(true,'workers-reset');toast('Workers reset to area recommendation')}}if(a.dataset.action==='smart-use-recommended-workers'){const f=$('#smartJobForm');if(f){const w=f.elements.workers;w.value=String(recommendWorkers(f.elements.area.value));w.dataset.manual='0';updateSmartEstimateDOM('workers-reset');toast('Workers reset to area recommendation')}}}

function init(){
 $('#app').innerHTML=shell();route=(location.hash||'#dashboard').slice(1);if(!NAV.some(n=>n[0]===route))route='dashboard';renderView();
 document.addEventListener('click',e=>{handleExtraAction(e);handleClick(e)});document.addEventListener('submit',handleSubmit);document.addEventListener('input',handleInput);document.addEventListener('change',handleChange);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(activeModal)closeModal();else closeDrawer()}});
 $('#globalSearch').addEventListener('focus',e=>globalSearch(e.target.value));
 document.addEventListener('click',e=>{if(!e.target.closest('#searchResults')&&!e.target.closest('#globalSearch'))hideSearch()});
 $('#searchResults').addEventListener('click',e=>{const item=e.target.closest('[data-search-index]');if(!item)return;const r=$('#searchResults')._rows?.[Number(item.dataset.searchIndex)];if(!r)return;hideSearch();if(r.action==='edit-invoice'){const inv=invoiceById(r.id);if(inv)openInvoiceEditor(deepClone(inv),false)}else navigate(r.route)});
 window.addEventListener('popstate',e=>{if(activeModal){closeModal();return}route=e.state?.route||(location.hash||'#dashboard').slice(1);if(!NAV.some(n=>n[0]===route))route='dashboard';renderView()});
 window.addEventListener('beforeunload',()=>saveDB());
 console.info(`GardenCare Business OS v${VERSION} loaded. Single-file UI, local-first storage.`)
}
init();
})();
</script>
