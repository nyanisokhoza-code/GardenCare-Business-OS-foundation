.modalHost{position:fixed;inset:0;z-index:80;pointer-events:none}.modalHost.open{pointer-events:auto}.modalBackdrop{position:absolute;inset:0;background:rgba(8,28,20,.52);opacity:0;transition:.15s}.modalPanel{position:absolute;right:0;top:0;height:100%;width:min(760px,96vw);background:var(--cream);box-shadow:-20px 0 50px rgba(0,0,0,.22);transform:translateX(100%);transition:.18s ease;display:flex;flex-direction:column}.modalHost.open .modalBackdrop{opacity:1}.modalHost.open .modalPanel{transform:translateX(0)}.modalHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px;background:white;border-bottom:1px solid var(--line)}.modalHead h2{margin:0;font-size:22px}.closeBtn{border:1px solid var(--line);background:white;border-radius:10px;padding:5px 10px;font-size:21px}.modalBody{padding:18px 20px 80px;overflow:auto;flex:1}.modalFoot{padding:12px 20px;background:white;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:absolute;bottom:0;right:0;left:0}.drawerBackdrop{display:none;position:fixed;inset:0;background:rgba(8,28,20,.43);z-index:25}

.helpBtn{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;border:1px solid #afbeb4;background:#fff;color:#456050;font-size:11px;font-weight:900;vertical-align:middle;padding:0}.toastStack{position:fixed;right:18px;bottom:18px;z-index:120;display:grid;gap:8px}.toast{background:#173e2d;color:white;padding:11px 13px;border-radius:12px;box-shadow:var(--shadow);max-width:360px;animation:toastIn .16s ease}.toast.bad{background:#913b36}@keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.searchResults{position:fixed;top:60px;left:calc(var(--sidebar) + 26px);z-index:50;width:min(520px,calc(100vw - var(--sidebar) - 60px));background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 45px rgba(28,57,45,.16);max-height:430px;overflow:auto}.searchItem{padding:11px 12px;border-bottom:1px solid #edf1ee;display:flex;justify-content:space-between;gap:12px;cursor:pointer}.searchItem:hover{background:#f5f8f5}.searchItem:last-child{border-bottom:0}.searchItem small{color:var(--muted)}
@media(max-width:1050px){.calcFields{grid-template-columns:repeat(2,minmax(0,1fr))}.estimateTotals{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.quickCards,.captureGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.invoiceRow{grid-template-columns:2fr 70px 80px 105px 120px 42px}}
@media(max-width:820px){:root{--sidebar:0px}.sidebar{transform:translateX(-100%);width:min(310px,88vw);transition:.18s ease}.sidebar.open{transform:none}.drawerClose,.menuBtn{display:block}.drawerBackdrop.open{display:block}.main{margin-left:0}.topbar{padding:0 14px;height:62px}.content{padding:17px 14px 55px}.search{width:min(60vw,380px)}.userChip span{display:none}.hero{grid-template-columns:1fr;padding:22px}.grid2,.grid3,.quickCards,.captureGrid{grid-template-columns:1fr}.formGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.inlineFields{grid-template-columns:repeat(2,minmax(0,1fr))}.pageHead{flex-direction:column}.searchResults{left:14px;top:55px;width:calc(100vw - 28px)}}
@media(max-width:620px){.calcFields,.estimateTotals{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.content{padding-left:10px;padding-right:10px}.card{padding:14px;border-radius:15px}.hero h2{font-size:27px}.invoiceRow{grid-template-columns:1fr 1fr}.invoiceRow>div:first-child{grid-column:1/-1}.invoiceRow .amountCell{grid-column:1/-1}.invoiceRow .removeCell{grid-column:1/-1}.rowRemove{width:100%}.modalPanel{width:100vw}.modalBody{padding:14px 12px 90px}.modalHead{padding:14px}.modalFoot{padding:10px 12px}.table{min-width:620px}.inlineFields{grid-template-columns:1fr}.summaryBar{justify-content:space-between;gap:10px}.summaryBar .sum{min-width:0}.clientActions .btn{flex:1 1 44%}}

<body>
<div id="app"></div>
<div id="modalHost" class="modalHost" aria-hidden="true"><div class="modalBackdrop" data-action="close-modal"></div><div class="modalPanel"><div id="modalContent"></div></div></div>
<div id="searchResults" class="searchResults hidden"></div>
<div id="toastStack" class="toastStack"></div>
<script>
(()=>{
'use strict';

const VERSION='0.8.2';
const KEY='gardencare_os_v081';
const OLD_KEY='gardencare_os_v08';
const DEFAULTS={
  version:VERSION,
  customers:[],properties:[],quotes:[],jobs:[],invoices:[],payments:[],employees:[],applicants:[],expenses:[],assessments:[],activity:[],
  settings:{
    businessName:'GardenCare',tagline:'Garden & Lawn Services',ownerName:'Nyaniso',currency:'ZAR',
    bankName:'ABSA',bankAccount:'9383 1400 33',bankBranch:'',paymentNote:'Please use the invoice number as the payment reference.',
    bagCost:50,invoiceBagPrice:70,coverageM2:40,wastePct:10,reserveBags:1,labourRate:180,defaultJobHours:3,
    dieselPrice:30,fuelKmPerLitre:12,returnTrip:true,vehicleCostPerKm:0,equipment:150,consumables:0,disposal:0,overheadPct:5,markupPct:30,callOutFee:350,
    vatPct:0,invoiceDueDays:7,
    labourRules:[{maxM2:50,workers:1},{maxM2:120,workers:2},{maxM2:250,workers:3},{maxM2:400,workers:4},{maxM2:999999,workers:5}]
  }
};
const NAV=[
 ['dashboard','🏠','Home'],['smart','⚡','New Job'],['customers','👤','Customers'],['properties','📍','Properties'],['scan','🌱','GardenScan'],
 ['quotes','📋','Quotes'],['jobs','🛠️','Jobs'],['invoices','🧾','Invoices'],['payments','💰','Payments'],['employees','👷','Employees'],
 ['recruitment','👥','Recruitment'],['training','🎓','Training'],['financials','💳','Financials'],['reports','📊','Reports'],['ai','🤖','AI Assistant'],
 ['callouts','📞','Call-outs'],['settings','⚙️','Settings']
];
let db=loadDB();
let route='dashboard';
let smartDraft={customerId:'',newCustomerName:'',phone:'',email:'',address:'',service:'Lawn restoration',area:0,bags:0,workers:1,hours:3,distanceKm:0,trips:1,returnTrip:true,fuelType:'Diesel',status:'Draft'};
let invoiceEditor=null;
let activeModal=null;

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'R '+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const today=()=>new Date().toISOString().slice(0,10);
function addDays(dateStr,days){const d=new Date((dateStr||today())+'T12:00:00');d.setDate(d.getDate()+Number(days||0));return d.toISOString().slice(0,10)}
function uid(prefix){return prefix+'-'+Math.random().toString(36).slice(2,8).toUpperCase()}
function deepClone(v){return JSON.parse(JSON.stringify(v))}
function normalizePhone(p){return String(p||'').replace(/\D/g,'').replace(/^0/,'27')}
function statusClass(s){const x=String(s||'').toLowerCase().replace(/\s+/g,'');return x==='partiallypaid'?'partial':x}
function activity(type,text,ref=''){db.activity.unshift({id:uid('ACT'),type,text,ref,at:new Date().toISOString()});db.activity=db.activity.slice(0,250)}

function loadDB(){
  try{
    const current=JSON.parse(localStorage.getItem(KEY)||'null');
    if(current) return normalizeDB(current);
    const old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');
    if(old){
      const migrated=normalizeDB(old);
      migrated.version=VERSION;
      migrated.invoices=(old.invoices||[]).map(i=>normalizeInvoice({
        ...i,number:i.id||nextInvoiceNumberFrom(migrated.invoices||[]),invoiceDate:(i.createdAt||today()).slice(0,10),dueDate:addDays((i.createdAt||today()).slice(0,10),7),
        items:i.items?.length?i.items:[{id:uid('LI'),description:'Previous invoice total',qty:1,unit:'service',unitPrice:num(i.total),mode:'amount'}]
      }));
      localStorage.setItem(KEY,JSON.stringify(migrated));
      return migrated;
    }
  }catch(err){console.warn('GardenCare data load failed',err)}
  return deepClone(DEFAULTS);
}
function normalizeDB(raw){
 const out=deepClone(DEFAULTS); Object.assign(out,raw||{}); out.settings=Object.assign({},DEFAULTS.settings,raw?.settings||{});
 for(const k of ['customers','properties','quotes','jobs','invoices','payments','employees','applicants','expenses','assessments','activity']) if(!Array.isArray(out[k])) out[k]=[];
 out.invoices=out.invoices.map(normalizeInvoice); out.version=VERSION; return out;
}
function normalizeInvoice(i){
 const inv={id:i.id||uid('INV'),number:i.number||i.id||'GC-INV',customerId:i.customerId||'',customerName:i.customerName||'',phone:i.phone||'',email:i.email||'',address:i.address||'',service:i.service||'',invoiceDate:i.invoiceDate||(i.createdAt?String(i.createdAt).slice(0,10):today()),dueDate:i.dueDate||addDays(today(),DEFAULTS.settings.invoiceDueDays||7),status:i.status||'Unpaid',items:Array.isArray(i.items)?i.items:[],discount:num(i.discount),vatPct:num(i.vatPct),notes:i.notes||'',jobId:i.jobId||'',quoteId:i.quoteId||'',paid:num(i.paid),createdAt:i.createdAt||new Date().toISOString(),updatedAt:i.updatedAt||new Date().toISOString()};
 inv.items=inv.items.map(x=>({id:x.id||uid('LI'),description:x.description||'',qty:(x.qty===undefined||x.qty===null||x.qty==='')?1:num(x.qty),unit:x.unit||'',unitPrice:num(x.unitPrice),mode:['amount','tbd','dash'].includes(x.mode)?x.mode:'amount'}));
 if(!inv.items.length && num(i.total)>0) inv.items=[{id:uid('LI'),description:'Service',qty:1,unit:'service',unitPrice:num(i.total),mode:'amount'}];
 return inv;
}

function nextSeq(records,field,prefix){let m=0;for(const r of records){const v=String(r[field]||r.id||'');const hit=v.match(/(\d+)$/);if(hit)m=Math.max(m,Number(hit[1]))}return prefix+String(m+1).padStart(3,'0')}
function nextInvoiceNumberFrom(records=db.invoices){return nextSeq(records,'number',`GC-INV-${new Date().getFullYear()}-`)}
function nextQuoteNumber(){return nextSeq(db.quotes,'id',`GC-Q-${new Date().getFullYear()}-`)}
function nextJobNumber(){return nextSeq(db.jobs,'id',`GC-JOB-${new Date().getFullYear()}-`)}

function calcInvoice(inv){
 const subtotal=(inv.items||[]).reduce((sum,it)=>sum+(it.mode==='amount'?num(it.qty)*num(it.unitPrice):0),0);
 const discount=Math.max(0,num(inv.discount)); const taxable=Math.max(0,subtotal-discount); const vat=taxable*Math.max(0,num(inv.vatPct))/100; const total=taxable+vat; const paid=Math.max(0,num(inv.paid)); const balance=Math.max(0,total-paid);
 return {subtotal,discount,vat,total,paid,balance};
}
function invoiceStatus(inv){const c=calcInvoice(inv);if(c.total>0&&c.balance<=.005)return'Paid';if(c.paid>0)return'Partially paid';if(inv.dueDate&&inv.dueDate<today())return'Overdue';return inv.status==='Draft'?'Draft':'Unpaid'}
function calcJob(area,workers,hours,distance,overrides={}){
 const s=db.settings;
 const val=(key,fallback)=>overrides[key]===undefined?num(fallback):num(overrides[key]);
 const a=Math.max(0,num(area));
 const coverage=Math.max(.1,val('coverageM2',s.coverageM2));
 const wastePct=Math.max(0,val('wastePct',s.wastePct));
 const reserveBags=Math.max(0,Math.round(val('reserveBags',s.reserveBags)));
 const bagCost=Math.max(0,val('bagCost',s.bagCost));
 const rawBags=a/coverage;
 const required=Math.ceil(rawBags*(1+wastePct/100));
 const bags=required+reserveBags;
 const material=bags*bagCost;
 const labourRate=Math.max(0,val('labourRate',s.labourRate));
 const workerCount=Math.max(1,num(workers)||1);
 const jobHours=Math.max(0,num(hours));
 const labour=workerCount*jobHours*labourRate;
 const oneWayKm=Math.max(0,num(distance));
 const trips=Math.max(1,Math.round(val('trips',1)||1));
 const returnTrip=overrides.returnTrip===undefined?Boolean(s.returnTrip):Boolean(overrides.returnTrip);
 const totalKm=oneWayKm*(returnTrip?2:1)*trips;
 const fuelKmPerLitre=Math.max(.1,val('fuelKmPerLitre',s.fuelKmPerLitre));
 const fuelPrice=Math.max(0,val('fuelPrice',s.dieselPrice));
 const fuelLitres=totalKm/fuelKmPerLitre;
 const fuelCost=fuelLitres*fuelPrice;
 const vehicleCostPerKm=Math.max(0,val('vehicleCostPerKm',s.vehicleCostPerKm||0));
 const vehicleCost=totalKm*vehicleCostPerKm;
 const travel=fuelCost+vehicleCost;
 const equipment=Math.max(0,val('equipment',s.equipment));
 const consumables=Math.max(0,val('consumables',s.consumables||0));
 const disposal=Math.max(0,val('disposal',s.disposal||0));
 const subtotal=material+labour+travel+equipment+consumables+disposal;
 const overheadPct=Math.max(0,val('overheadPct',s.overheadPct));
 const overhead=subtotal*overheadPct/100;
 const cost=subtotal+overhead;
 const markupPct=Math.max(0,val('markupPct',s.markupPct));
 const markup=cost*markupPct/100;
 const sell=cost+markup;
 return{bags,rawBags,required,material,labour,labourRate,travel,totalKm,fuelLitres,fuelCost,vehicleCost,vehicleCostPerKm,equipment,consumables,disposal,subtotal,overhead,overheadPct,cost,markup,markupPct,sell,coverage,wastePct,reserveBags,bagCost,trips,returnTrip,fuelKmPerLitre,fuelPrice,workerCount,jobHours};
}

 return{...raw,area:num(raw.area),workers:num(raw.workers)||1,hours:num(raw.hours),distanceKm:num(raw.distanceKm),trips:Math.max(1,num(raw.trips)||1),returnTrip:form.elements.returnTrip?.checked??true,bagCost:num(raw.bagCost),coverageM2:num(raw.coverageM2),wastePct:num(raw.wastePct),reserveBags:num(raw.reserveBags),labourRate:num(raw.labourRate),fuelPrice:num(raw.fuelPrice),fuelKmPerLitre:num(raw.fuelKmPerLitre),vehicleCostPerKm:num(raw.vehicleCostPerKm),equipment:num(raw.equipment),consumables:num(raw.consumables),disposal:num(raw.disposal),overheadPct:num(raw.overheadPct),markupPct:num(raw.markupPct)};

 const bagHint=$('#smartBagFormula');if(bagHint)bagHint.textContent=`${v.area||0} m² ÷ ${c.coverage.toFixed(1)} m²/bag + ${c.wastePct}% wastage + ${c.reserveBags} reserve = ${c.bags} bag(s) to site.`;

 const labourHint=$('#smartLabourFormula');if(labourHint)labourHint.textContent=`${c.workerCount} worker(s) × ${c.jobHours.toFixed(1)} hour(s) × ${money(c.labourRate)}/hour = ${money(c.labour)}.`;

function quoteSeed(q){
 const j=db.jobs.find(x=>x.quoteId===q.id)||{};const e=q.estimate||j.estimate||{};const s=db.settings;

}

 $('#searchResults').addEventListener('click',e=>{const item=e.target.closest('[data-search-index]');if(!item)return;const r=$('#searchResults')._rows?.[Number(item.dataset.searchIndex)];if(!r)return;hideSearch();if(r.action==='edit-invoice'){const inv=invoiceById(r.id);if(inv)openInvoiceEditor(deepClone(inv),false)}else navigate(r.route)});
 window.addEventListener('popstate',e=>{if(activeModal){closeModal();return}route=e.state?.route||(location.hash||'#dashboard').slice(1);if(!NAV.some(n=>n[0]===route))route='dashboard';renderView()});
 window.addEventListener('beforeunload',()=>saveDB());
 console.info(`GardenCare Business OS v${VERSION} loaded. Single-file UI, local-first storage.`)
}
init();
